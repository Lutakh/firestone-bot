name: build

on:
  push:
    branches: [python-rework, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q tests
      - name: Tag must match __version__
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c "import firestone_bot, os, sys; tag = os.environ['GITHUB_REF_NAME']; sys.exit(0 if tag == 'v' + firestone_bot.__version__ else f'tag {tag} != v{firestone_bot.__version__}')"

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            archive: FirestoneBot-windows.zip
          - os: ubuntu-22.04
            archive: FirestoneBot-linux.tar.gz
          - os: macos-14
            archive: FirestoneBot-macos.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Compile PyInstaller's bootloader from source (Windows)
        # The stock bootloader is the same file in every PyInstaller app, malware included, and
        # antivirus ML models weigh it (Defender: Trojan:Win32/Bearfoos.B!ml); PyInstaller's
        # docs suggest compiling your own. The version pinned in pyproject.toml is reinstalled
        # from its sdist and the runner's MSVC builds the bootloader, as PyInstaller's own CI
        # does on windows-latest (PYINSTALLER_BOOTLOADER_WAF_ARGS=--clang or --gcc would pick
        # another compiler of the image). pip installs nothing unless the build succeeds: a
        # failure leaves the stock wheel in place, the check below says so, and the release
        # goes on. The smoke test after the build runs the exe whatever its bootloader.
        if: runner.os == 'Windows'
        continue-on-error: true
        timeout-minutes: 20  # a stuck compile must not hold the release for the job's 6 h
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        shell: bash
        run: |
          v=$(python -c "import PyInstaller; print(PyInstaller.__version__)")
          python -m pip install --verbose --force-reinstall --no-deps --no-binary pyinstaller "pyinstaller==$v"
      - name: Bootloader check (Windows)
        # Reports which windowed bootloader the exe gets: compiled here, or the stock one
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        run: |
          v=$(python -c "import PyInstaller; print(PyInstaller.__version__)")
          python -m pip download --quiet --no-deps --only-binary=:all: -d "$RUNNER_TEMP/stock" "pyinstaller==$v"
          python - "$RUNNER_TEMP/stock" <<'EOF'
          import glob, hashlib, os, sys, zipfile
          import PyInstaller
          rel = f"bootloader/{PyInstaller.PLATFORM}/runw.exe"
          wheel = glob.glob(os.path.join(sys.argv[1], "pyinstaller-*.whl"))[0]
          stock = hashlib.sha256(zipfile.ZipFile(wheel).read("PyInstaller/" + rel)).hexdigest()
          with open(os.path.join(os.path.dirname(PyInstaller.__file__), rel), "rb") as f:
              used = hashlib.sha256(f.read()).hexdigest()
          print(f"runw.exe of the {os.path.basename(wheel)} wheel: {stock}")
          print(f"runw.exe used for this build: {used}")
          if used == stock:
              print("::warning::FirestoneBot.exe is built on PyInstaller's stock bootloader")
          EOF
      - name: Import the self-signed code-signing certificate (macOS)
        # Secrets MACOS_CERT_P12 (base64 of the .p12) and MACOS_CERT_PASSWORD, see
        # tools/mac_codesign.py. Without them the bundle is ad-hoc signed.
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          python -m firestone_bot.tools.mac_codesign import-keychain cert.p12 "$MACOS_CERT_PASSWORD"
          rm cert.p12
          echo "FIRESTONE_CODESIGN_IDENTITY=Firestone Bot" >> "$GITHUB_ENV"
      - run: pyinstaller firestone-bot.spec
      - name: Check the version resource of FirestoneBot.exe (Windows)
        if: runner.os == 'Windows'
        run: |
          $want = python -c "import firestone_bot; print(firestone_bot.__version__)"
          $info = (Get-Item dist/FirestoneBot/FirestoneBot.exe).VersionInfo
          $info | Format-List ProductName, ProductVersion, FileVersionRaw, CompanyName, OriginalFilename
          if ($info.ProductName -ne "Firestone Bot" -or $info.ProductVersion -ne $want) {
            throw "FirestoneBot.exe says '$($info.ProductName)' '$($info.ProductVersion)', expected 'Firestone Bot' '$want'"
          }
      - name: Smoke test FirestoneBot.exe (Windows)
        # The exe (bootloader, PKG, Python, the bot's imports) must get as far as the bot's
        # first log line, written before the window is built. Runs on a copy: the log and
        # settings it writes stay out of the archive.
        if: runner.os == 'Windows'
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "smoke"
          Copy-Item dist/FirestoneBot $dir -Recurse
          $log = Join-Path $dir "firestone-bot.log"
          $p = Start-Process (Join-Path $dir "FirestoneBot.exe") -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          while (-not ((Test-Path $log) -and (Get-Item $log).Length -gt 0) -and -not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
          }
          $started = (Test-Path $log) -and (Get-Item $log).Length -gt 0
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if (-not $started) { throw "FirestoneBot.exe wrote no log line within 90 s (exited: $($p.HasExited))" }
          Get-Content $log -TotalCount 20
      - name: Re-sign the bundle deep (macOS, certificate available)
        if: runner.os == 'macOS' && env.FIRESTONE_CODESIGN_IDENTITY != ''
        run: python -m firestone_bot.tools.mac_codesign sign dist/FirestoneBot.app
      - name: Add example settings
        if: runner.os != 'macOS'
        run: cp settings.ini.example dist/FirestoneBot/settings.ini.example
        shell: bash
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/FirestoneBot/* -DestinationPath ${{ matrix.archive }}
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf ${{ matrix.archive }} FirestoneBot
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --verify --deep --strict dist/FirestoneBot.app && codesign -dv dist/FirestoneBot.app 2>&1 | head -3
          ditto -c -k --keepParent dist/FirestoneBot.app ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write  # create the release and attach the archives
    steps:
      # checkout FIRST: it cleans the workspace (it would delete downloaded artifacts) and
      # peels the tag, so the annotated tag object is fetched again explicitly for its message
      - uses: actions/checkout@v4
      - name: Release notes from the tag annotation
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref "refs/tags/$GITHUB_REF_NAME" --format='%(contents)' > notes.md  # not :body, that would drop the first line (a heading) as "subject"
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums (read by the bot's self-update)
        # The archives, plus the FirestoneBot.exe inside the Windows zip so that a player can
        # check a copy an antivirus quarantined and restored (README); the self-update only
        # reads the line of its archive.
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum FirestoneBot-*.zip FirestoneBot-*.tar.gz > SHA256SUMS.txt
          exe=$(unzip -p FirestoneBot-windows.zip FirestoneBot.exe | sha256sum | cut -d' ' -f1)
          echo "$exe  FirestoneBot.exe" >> SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            artifacts/FirestoneBot-windows.zip
            artifacts/FirestoneBot-linux.tar.gz
            artifacts/FirestoneBot-macos.zip
            artifacts/SHA256SUMS.txt
      - name: Release body from the tag message (also when the release already existed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --repo "$GITHUB_REPOSITORY"

  virustotal:
    # VirusTotal verdict on this run's Windows exe (firestone_bot/tools/virustotal.py; secret
    # VT_API_KEY, the key of a free VirusTotal account, owner 2026-10-28). Players' Defender
    # quarantined releases as Trojan:Win32/Bearfoos.B!ml. Every build is a new file
    # (PyInstaller stamps the build time), so the exe is uploaded and its analysis waited for,
    # minutes: a job of its own that neither the archives nor the release wait for, and that
    # never fails the run. On a tag it comes after the release and adds the report's link to
    # the release notes: the branch run of the same commit scans another exe.
    needs: [build, release]
    if: ${{ !cancelled() && needs.build.result == 'success' }}  # also when release is skipped
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 20
    permissions:
      contents: write  # the release notes of a tag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: FirestoneBot-windows.zip
          path: artifacts
      - name: VirusTotal verdict on FirestoneBot.exe
        # run from the checkout, standard library only: nothing to install. Its own time limit,
        # under the job's: virustotal.md is written as soon as VirusTotal holds the file, and
        # the next step still adds it to a tag's notes when the analysis wait runs out of time
        continue-on-error: true
        timeout-minutes: 15
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          unzip -q artifacts/FirestoneBot-windows.zip FirestoneBot.exe -d exe
          python -m firestone_bot.tools.virustotal exe/FirestoneBot.exe --summary "$GITHUB_STEP_SUMMARY" --notes virustotal.md
      - name: Report link in the release notes (tag)
        # the body the release job wrote (the tag message) without the exact link line an
        # earlier attempt added (tools/virustotal.py notes_line), then this one; a failed read
        # stops the step before any edit
        if: startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success' && hashFiles('virustotal.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > body.md
          body=$(grep -vE '^VirusTotal report of FirestoneBot\.exe: https://www\.virustotal\.com/gui/file/[0-9a-f]{64}[[:space:]]*$' body.md || true)
          if [ -n "$body" ]; then printf '%s\n\n' "$body" > notes.md; else : > notes.md; fi
          cat virustotal.md >> notes.md
          cat notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
