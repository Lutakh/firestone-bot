[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firestone-bot"
version = "0.2.10"
description = "Python port of the Firestone Idle RPG AutoHotkey bot"
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=5.2.2,<6",
    "mss>=9.0,<10",
    "numpy>=1.26,<3",
    "pynput>=1.7.7,<2",
    "psutil>=5.9,<7",
    "certifi>=2024.2",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "pyinstaller>=6"]

[project.scripts]
firestone-bot = "firestone_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["firestone_bot*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
# features/*_test.py are ported AHK modules, not tests; they import pynput (needs a display)
python_files = ["test_*.py"]
